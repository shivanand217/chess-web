# pnpm 11 moved both the "which transitive deps may run build scripts" allowlist AND dependency
# overrides out of package.json. Keep this list tight — anything in here can execute arbitrary code
# during install.
onlyBuiltDependencies:
  - unrs-resolver

# Point @chess/* at the sibling repo's source. The SDK's own package.json uses `workspace:*`
# internally; outside its home workspace that would error, so we rewrite those references here.
overrides:
  "@chess/client": link:../Chess/packages/client
  "@chess/protocol": link:../Chess/packages/protocol
