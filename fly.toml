# Public Next.js frontend. Build from the parent dir containing both this repo and ../Chess (see
# Dockerfile for the exact command). Serves the compiled Next standalone bundle on 3000.
app = "chess-web"
primary_region = "iad"

# Dockerfile path is passed on the CLI; the build is run from the parent of this repo so the
# sibling Chess checkout is in context (see chess-web/Dockerfile for details).

[env]
  NODE_ENV = "production"
  # The gateway's public hostname — the browser hits this for /auth, /matchmaking, /games, etc.
  NEXT_PUBLIC_GATEWAY_URL = "https://chess-gateway.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "15s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
